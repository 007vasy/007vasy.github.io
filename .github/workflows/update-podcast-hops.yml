name: Update podcast hops graph

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast-hops-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements-podcast-hops.txt

      - name: Install spaCy
        run: |
          pip install -r scraper/requirements-podcast-hops.txt
          python -m spacy download en_core_web_sm

      - name: Scan new podcast guests
        run: python scraper/podcast_hops.py

      - name: Commit graph if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/podcast-hops/graph.json docs/podcast-hops/episodes.json
          if git diff --cached --quiet; then
            echo "No graph changes"
            exit 0
          fi
          git commit -m "chore: refresh podcast hops graph"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
